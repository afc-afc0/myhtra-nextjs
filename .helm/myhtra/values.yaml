image:
  containerName: nextjs
  repository: icanjump/myhtra-nextjs
  pullPolicy: Always
  # Set by deploy.sh to the commit's short SHA; rendering fails if it is missing
  tag: ''
  containerPort: 3000
  secretName: myhtra-nextjs-environment

service:
  name: myhtra-service
  # Internal only: traffic enters through the HTTPS ingress, which targets the cluster IP
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    # Generous headroom: ~60Mi idle in a local hardened run, but real traffic is unmeasured
    memory: 1Gi

# Matches the nextjs user (uid 1001) / nodejs group (gid 1001) in the Dockerfile
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

deployment:
  replicas: 1
  strategy: Recreate
  name: myhtra-deployment
  labels:
    app: myhtra
    type: frontend

# Does cert issuer handles this
ingress:
  name: myhtra-ingress
  secretName: www-tls
  # Serve www.myhtra.co as a redirect to the apex (DNS: www CNAME myhtra.co).
  # The ingress annotation (ingress-shim) is the only owner of the www-tls Certificate;
  # don't add a hand-made Certificate for the same secret or they fight over it.
  wwwRedirect: true

# For TLS
podLabels:
  azure.workload.identity/use: 'true'
serviceAccount:
  labels:
    azure.workload.identity/use: 'true'
