image:
  containerName: nextjs
  repository: icanjump/myhtra-nextjs
  pullPolicy: Always
  # Set by deploy.sh to the commit's short SHA; rendering fails if it is missing
  tag: ''
  containerPort: 3000
  secretName: myhtra-nextjs-environment

service:
  name: myhtra-service
  type: LoadBalancer
  port: 80

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

# Matches the nextjs user (uid 1001) / nodejs group (gid 1001) in the Dockerfile
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

deployment:
  replicas: 1
  strategy: Recreate
  name: myhtra-deployment
  labels:
    app: myhtra
    type: frontend

# Does cert issuer handles this
ingress:
  name: myhtra-ingress
  secretName: www-tls

# For TLS
podLabels:
  azure.workload.identity/use: 'true'
serviceAccount:
  labels:
    azure.workload.identity/use: 'true'
